services:
  - type: web
    name: kora
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: OBSIDIAN_VAULT_PATH
        value: /app/vault
      - key: KORA_ACCESS_TOKEN
        sync: false
      - key: VAULT_PASTAS_BLOQUEADAS
        value: Pessoal
