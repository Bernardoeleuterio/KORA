<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KORA</title>

    <!-- PWA: permite adicionar o KORA a tela inicial do celular (Etapa 15) -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#050810" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KORA" />

    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <div class="hud">
        <header class="hud-cabecalho">
            <button
                type="button"
                id="botao-voz"
                class="hud-botao-voz"
                title="Modo silencioso (clique para ativar a voz)"
            >🔇</button>
            <canvas id="orbe" class="hud-orbe"></canvas>
            <h1 class="hud-titulo">KORA</h1>
        </header>

        <main id="chat" class="hud-chat"></main>

        <form id="formulario-chat" class="hud-formulario">
            <input
                type="text"
                id="campo-mensagem"
                class="hud-campo"
                placeholder="Digite sua mensagem..."
                autocomplete="off"
                disabled
            />
            <button
                type="button"
                id="botao-microfone"
                class="hud-botao hud-botao-microfone"
                title="Falar"
                disabled
            >🎤</button>
            <button type="submit" class="hud-botao" disabled>Enviar</button>
        </form>
    </div>

    <script src="js/visualizer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
