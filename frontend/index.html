<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KORA</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <div class="hud">
        <header class="hud-cabecalho">
            <canvas id="orbe" class="hud-orbe"></canvas>
            <h1 class="hud-titulo">KORA</h1>
        </header>

        <main id="chat" class="hud-chat"></main>

        <form id="formulario-chat" class="hud-formulario">
            <input
                type="text"
                id="campo-mensagem"
                class="hud-campo"
                placeholder="Digite sua mensagem..."
                autocomplete="off"
                disabled
            />
            <button type="submit" class="hud-botao" disabled>Enviar</button>
        </form>
    </div>

    <script src="js/visualizer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
